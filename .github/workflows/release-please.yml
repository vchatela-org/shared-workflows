# =============================================================================
# Reusable Workflow: release-please (release PR -> tag + GitHub Release -> builds)
# =============================================================================
# Every push to the caller's default branch updates ONE open release PR: the next
# version (from the conventional commits since the last release) and its CHANGELOG
# entry. Several features and fixes pile up in it; merging it is the release:
# release-please then creates the tag and the GitHub Release, whose notes Renovate
# and Dependabot show in their version-bump PRs.
#
# A tag created with the default GITHUB_TOKEN starts no workflow, so the caller's
# image builds are started here with `workflow_dispatch` on the new tag (the one
# event that token may trigger). No PAT needed; the builds see the tag as their ref
# exactly as on a pushed tag.
#
# Usage (caller, triggered on push to the default branch). The caller grants all four
# permissions even with no build workflow: GitHub checks a nested job's permissions
# when the run starts, before its `if`.
#   permissions:
#     contents: write
#     issues: write
#     pull-requests: write
#     actions: write
#   jobs:
#     release:
#       uses: vchatela-org/shared-workflows/.github/workflows/release-please.yml@v1
#       with:
#         build_workflows: docker-build-push.yml ghcr-publish.yml
# =============================================================================

name: Release (release-please)

on:
  workflow_call:
    inputs:
      build_workflows:
        description: >-
          Workflow files of the calling repository to start on the new tag,
          space-separated (e.g. "docker-build-push.yml ghcr-publish.yml").
          Each must accept workflow_dispatch. Empty = start nothing.
        required: false
        type: string
        default: ""
      config_file:
        description: "release-please config file"
        required: false
        type: string
        default: "release-please-config.json"
      manifest_file:
        description: "release-please manifest file (the current version)"
        required: false
        type: string
        default: ".release-please-manifest.json"
      runs_on:
        description: "Runner label (needs gh and jq: the version guard and the build dispatch use them)"
        required: false
        type: string
        default: "ubuntu-latest"

    outputs:
      release_created:
        description: "'true' when this run created a release, empty otherwise"
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: "The release tag (e.g. v1.4.0), when one was created"
        value: ${{ jobs.release-please.outputs.tag_name }}
      version:
        description: "The released version (e.g. 1.4.0), when one was created"
        value: ${{ jobs.release-please.outputs.version }}

jobs:
  release-please:
    runs-on: ${{ inputs.runs_on }}
    # Two pushes in a row must not race on the same release PR or tag. Named so it
    # cannot collide with a concurrency group the caller sets on its own run.
    concurrency:
      group: shared-release-please-${{ inputs.manifest_file }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # A release cut by hand (a pushed v* tag) leaves the manifest behind: release-please
      # would then propose a version that already shipped, and merging that PR fails or
      # publishes on the old tag. A release-as left after its release does the same.
      # Refuse to run until the manifest or the config is put right. Reads both files on
      # the default branch, as release-please does. Assumes one package (".") and v* tags.
      - name: The manifest is the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIG: ${{ inputs.config_file }}
          MANIFEST: ${{ inputs.manifest_file }}
        run: |
          set -euo pipefail
          read_file() {
            gh api "repos/$GITHUB_REPOSITORY/contents/$1?ref=$default_branch" --jq .content | base64 -d
          }
          # a is above b (version order)
          above() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n1)" = "$1" ]; }

          default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          manifest=$(read_file "$MANIFEST" | jq -r '."." // empty')
          if [ -z "$manifest" ]; then
            echo "::notice::No \".\" package in $MANIFEST: version guard skipped"
            exit 0
          fi
          tags=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --paginate \
            --jq '.[].ref | ltrimstr("refs/tags/v")' | { grep -E '^[0-9]+(\.[0-9]+)*$' || true; })
          highest=$(printf '%s\n' "$tags" | sort -V | tail -n1)
          if [ -n "$highest" ] && above "$highest" "$manifest"; then
            echo "::error::Tag v$highest is above the manifest's $manifest: a release was cut by hand. Set $MANIFEST (and the version files) to $highest in a PR, or delete the tag if it is a stray one; release-please resumes from there."
            exit 1
          fi
          release_as=$(read_file "$CONFIG" | jq -r '.packages["."]["release-as"] // .["release-as"] // empty')
          if [ -n "$release_as" ] && printf '%s\n' "$tags" | grep -qxF "$release_as"; then
            echo "::error::$CONFIG still forces release-as $release_as, and v$release_as is already tagged. Remove it."
            exit 1
          fi

      - name: Release PR, or tag + GitHub Release once it is merged
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: ${{ inputs.config_file }}
          manifest-file: ${{ inputs.manifest_file }}

  # A job of its own so that "Re-run failed jobs" retries only the dispatch, with the
  # tag it was given. `!cancelled()`: release-please creates the release before it
  # updates PRs, so a failure after that point must still start the builds.
  dispatch-builds:
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.outputs.release_created == 'true' && inputs.build_workflows != '' }}
    runs-on: ${{ inputs.runs_on }}
    permissions:
      actions: write
    steps:
      - name: Start the build workflows on the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          WORKFLOWS: ${{ inputs.build_workflows }}
        run: |
          failed=0
          for wf in $WORKFLOWS; do
            # A re-run must not start a build twice: a second push of the same tag
            # gets a new digest (the "created" label differs) under the same name.
            started=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" \
              --event workflow_dispatch --branch "$TAG" --json databaseId --jq 'length' || echo 0)
            if [ "${started:-0}" -gt 0 ]; then
              echo "\`$wf\` already started on \`$TAG\`, skipped" | tee -a "$GITHUB_STEP_SUMMARY"
            elif gh workflow run "$wf" --repo "$GITHUB_REPOSITORY" --ref "$TAG"; then
              echo "Started \`$wf\` on \`$TAG\`" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Could not start $wf on $TAG (does it accept workflow_dispatch?)"
              failed=1
            fi
          done
          exit "$failed"
